<style>

:root{

  --select:#d9ecff;
}

}

body{

}


/* =============================================
   TOPP
============================================= */

/* =============================================
   NEDTREKKSMENYER

   1. Studentgruppe

============================================= */

select.bankSelect{

#courseSelect{

}


/* =============================================
   STATUS
============================================= */

.dataStatus{

}


/* =============================================
   HJULOMRÅDE
============================================= */

.stage{

  grid-template-columns:

  gap:14px;

  padding:

}

.panel{

  height:100%;

   PEKER
============================================= */

.pointer{
  position:absolute;

  top:-2px;
  left:50%;

  transform:
    translateX(-50%);

  width:0;
  height:0;

  border-left:
    15px solid transparent;

  border-right:
    15px solid transparent;

  border-top:
    34px solid var(--red);

/* =============================================
   RESULTAT
============================================= */

.result{

  font-weight:bold;

}


/* =============================================
   SPØRSMÅL OG SVAR
============================================= */

.box{

  border-radius:14px;

  margin:
    0 12px 10px;

  box-shadow:

}

.hidden{

}


/* =============================================
   IPAD / MINDRE SKJERMER
============================================= */

@media(max-width:900px){

  h1{
    font-size:40px;
  }

  .stage{

  }

  button{

    min-width:130px;

  select.bankSelect{
    font-size:18px;

    min-width:200px;

  }

  #classSelect{
    min-width:250px;
  }

  #courseSelect{
    min-width:180px;
  }

  #topicSelect{
    min-width:280px;
  }

  .box{
    font-size:23px;
  }

  .answer{
    font-size:25px;
  }
}

</style>

<script>

(function(){

"use strict";


var MAX = 30;


/* =============================================
   FILNAVN
============================================= */

var STUDENT_CSV_PATHS = [

  "studenter.csv",
  "data/studenter.csv"

];


var QUESTION_CSV_PATHS = [

  "sporsmalsbank.csv",
  "data/sporsmalsbank.csv"

];


/* =============================================
   DATA
============================================= */

var classBanks = [];

var questionBanks = [];

var courses = [];

var visibleQuestionBanks = [];

var names = [];

var questions = [];

var answers = [];

var almostAnswers = [];

var littleAnswers = [];

var wrongAnswers = [];

var usedStudents = [];

var usedQuestions = [];

var selectedQuestion = -1;

var spinning = false;

var studentAngle = 0;

var questionAngle = 0;


/* =============================================
   CANVAS
============================================= */

var sc =
  document.getElementById(
    "studentCanvas"
  );


var qc =
  document.getElementById(
    "questionCanvas"
  );


var sctx =
  sc.getContext("2d");


var qctx =
  qc.getContext("2d");


function el(id){

  return document.getElementById(id);

}


/* =============================================
   NORMALISERING
============================================= */

function normalizeValue(value){

  return String(
    value || ""
  )
  .replace(/\u00A0/g," ")
  .trim()
  .replace(/\s+/g," ");

}


/* =============================================
   CSV-FUNKSJONER
============================================= */

function cleanText(text){

  if(
    text &&
    text.charCodeAt(0) === 0xFEFF
  ){

    text =
      text.slice(1);

  }

  return text;

}


function detectDelimiter(firstLine){

  var semicolonCount =
    (
      firstLine.match(/;/g) || []
    ).length;


  var commaCount =
    (
      firstLine.match(/,/g) || []
    ).length;


  return semicolonCount >
    commaCount ?
    ";" :
    ",";

}


function parseCSVLine(
  line,
  delimiter
){

  var result = [];

  var current = "";

  var inQuotes = false;


  for(
    var i=0;
    i<line.length;
    i++
  ){

    var ch =
      line[i];


    if(
      ch === '"'
    ){

      if(
        inQuotes &&
        line[i+1] === '"'
      ){

        current += '"';

        i++;

      }
      else{

        inQuotes =
          !inQuotes;

      }

    }

    else if(
      ch === delimiter &&
      !inQuotes
    ){

      result.push(
        current.trim()
      );

      current = "";

    }

    else{

      current += ch;

    }

  }


  result.push(
    current.trim()
  );


  return result;

}


function normalizeHeader(text){

  return String(
    text || ""
  )
  .trim()
  .toLowerCase()
  .replace(/\s+/g,"");

}


/* =============================================
   LES STUDENTER.CSV
============================================= */

function parseStudentCSV(text){

  text =
    cleanText(text);


  var lines =
    text
    .split(/\r?\n/)
    .filter(
      function(line){

        return line.trim() !== "";

      }
    );


  if(
    lines.length < 2
  ){

    throw new Error(
      "CSV-filen inneholder ingen studentdata."
    );

  }


  var delimiter =
    detectDelimiter(
      lines[0]
    );


  var headers =
    parseCSVLine(
      lines[0],
      delimiter
    )
    .map(
      normalizeHeader
    );


  var index = {};


  headers.forEach(
    function(header,i){

      index[header] = i;

    }
  );


  if(
    index.fornavn === undefined
  ){

    throw new Error(
      "Fant ikke kolonnen Fornavn."
    );

  }


  var rows = [];


  for(
    var r=1;
    r<lines.length;
    r++
  ){

    var cells =
      parseCSVLine(
        lines[r],
        delimiter
      );


    function value(column){

      if(
        index[column] === undefined
      ){

        return "";

      }


      return normalizeValue(
        cells[
          index[column]
        ] || ""
      );

    }


    var row = {

      studieprogram:
        value("studieprogram"),

      kull:
        value("kull"),

      gruppe:
        value("gruppe"),

      fornavn:
        value("fornavn"),

      etternavn:
        value("etternavn")

    };


    if(
      row.fornavn
    ){

      rows.push(
        row
      );

    }

  }


  return rows;

}


/* =============================================
   BYGG STUDENTBANKER
============================================= */

function buildClassBanks(rows){

  var groups = {};


  rows.forEach(
    function(student){

      var program =
        student.studieprogram ||
        "Klasse";


      var kull =
        student.kull ||
        "";


      var gruppe =
        student.gruppe ||
        "";


      var key =
        program +
        "|" +
        kull +
        "|" +
        gruppe;


      if(
        !groups[key]
      ){

        groups[key] = {

          studieprogram:
            program,

          kull:
            kull,

          gruppe:
            gruppe,

          students:
            []

        };

      }


      groups[key].students.push({

        first:
          student.fornavn,

        last:
          student.etternavn

      });

    }
  );


  var banks = [];


  Object.keys(
    groups
  ).forEach(
    function(key){

      var group =
        groups[key];


      var firstNameCount = {};


      group.students.forEach(
        function(student){

          var n =
            student.first.toLowerCase();


          firstNameCount[n] =
            (
              firstNameCount[n] ||
              0
            ) +
            1;

        }
      );


      var studentNames =
        group.students.map(
          function(student){

            var sameName =
              firstNameCount[
                student.first.toLowerCase()
              ] > 1;


            if(
              sameName &&
              student.last
            ){

              return student.first +
                " " +
                student.last.charAt(0) +
                ".";

            }


            return student.first;

          }
        );


      studentNames =
        studentNames.filter(
          function(
            name,
            index,
            array
          ){

            return array.indexOf(
              name
            ) === index;

          }
        );


      studentNames =
        studentNames.slice(
          0,
          MAX
        );


      var displayKull =
        String(
          group.kull || ""
        );


      if(
        displayKull.length === 4
      ){

        displayKull =
          displayKull.slice(2);

      }


      var displayName =
        [
          group.studieprogram,
          displayKull,
          group.gruppe
        ]
        .filter(Boolean)
        .join(" ");


      banks.push({

        name:
          displayName,

        students:
          studentNames

      });

    }
  );


  banks.sort(
    function(a,b){

      return a.name.localeCompare(
        b.name,
        "no",
        {
          numeric:true
        }
      );

    }
  );


  return banks;

}


/* =============================================
   LAST STUDENTER.CSV
============================================= */

async function loadStudentCSV(){

  for(
    var i=0;
    i<STUDENT_CSV_PATHS.length;
    i++
  ){

    var path =
      STUDENT_CSV_PATHS[i];


    try{

      var response =
        await fetch(
          path +
          "?v=" +
          Date.now(),
          {
            cache:"no-store"
          }
        );


      if(
        !response.ok
      ){

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      var text =
        await response.text();


      var rows =
        parseStudentCSV(
          text
        );


      classBanks =
        buildClassBanks(
          rows
        );


      if(
        classBanks.length === 0
      ){

        throw new Error(
          "Ingen studentgrupper funnet."
        );

      }


      refreshClassList();


      return;

    }

    catch(error){

      console.log(
        "Studentfil:",
        path,
        error
      );

    }

  }


  el(
    "classSelect"
  ).innerHTML =
    "<option>Studentliste mangler</option>";

}


/* =============================================
   STUDENTMENY
============================================= */

function refreshClassList(){

  var select =
    el(
      "classSelect"
    );


  select.innerHTML =
    "";


  classBanks.forEach(
    function(
      bank,
      index
    ){

      var option =
        document.createElement(
          "option"
        );


      option.value =
        index;


      option.textContent =
        bank.name;


      select.appendChild(
        option
      );

    }
  );


  if(
    classBanks.length > 0
  ){

    select.value = 0;

    loadClass();

  }

}


window.loadClass =
function(){

  var index =
    parseInt(
      el(
        "classSelect"
      ).value,
      10
    );


  var bank =
    classBanks[
      index
    ];


  if(
    !bank
  ){

    names = [];

    drawAll();

    return;

  }


  names =
    bank.students ||
    [];


  resetSession();

};


/*
=================================================
SLUTT DEL 1 AV 3
=================================================
*//* =============================================
   LES SPØRSMÅLSBANK.CSV
============================================= */

function parseQuestionCSV(text){

  text =
    cleanText(text);


  var lines =
    text
    .split(/\r?\n/)
    .filter(
      function(line){

        return line.trim() !== "";

      }
    );


  if(
    lines.length < 2
  ){

    throw new Error(
      "CSV-filen inneholder ingen spørsmål."
    );

  }


  var delimiter =
    detectDelimiter(
      lines[0]
    );


  var headers =
    parseCSVLine(
      lines[0],
      delimiter
    )
    .map(
      normalizeHeader
    );


  var index = {};


  headers.forEach(
    function(header,i){

      index[header] = i;

    }
  );


  function findColumn(names){

    for(
      var i=0;
      i<names.length;
      i++
    ){

      if(
        index[
          names[i]
        ] !== undefined
      ){

        return index[
          names[i]
        ];

      }

    }


    return -1;

  }


  var colIndex =
    findColumn([
      "indeks",
      "index"
    ]);


  var colCourse =
    findColumn([
      "emne"
    ]);


  var colModule =
    findColumn([
      "modul"
    ]);


  var colTopic =
    findColumn([
      "tema"
    ]);


  var colQuestion =
    findColumn([
      "spørsmål",
      "sporsmal"
    ]);


  var colCorrect =
    findColumn([
      "riktigsvar",
      "riktig"
    ]);


  var colAlmost =
    findColumn([
      "nestenriktig",
      "nesten"
    ]);


  var colLittle =
    findColumn([
      "littriktig",
      "litt"
    ]);


  var colWrong =
    findColumn([
      "feilsvar",
      "feil"
    ]);


  if(
    colCourse < 0 ||
    colModule < 0 ||
    colTopic < 0 ||
    colQuestion < 0 ||
    colCorrect < 0
  ){

    throw new Error(
      "Fant ikke nødvendige kolonner i spørsmålsbanken."
    );

  }


  var rows = [];


  for(
    var r=1;
    r<lines.length;
    r++
  ){

    var cells =
      parseCSVLine(
        lines[r],
        delimiter
      );


    function cell(column){

      if(
        column < 0
      ){

        return "";

      }


      return normalizeValue(
        cells[
          column
        ] || ""
      );

    }


    var row = {

      index:
        cell(
          colIndex
        ),

      course:
        cell(
          colCourse
        ),

      module:
        cell(
          colModule
        ),

      topic:
        cell(
          colTopic
        ),

      question:
        cell(
          colQuestion
        ),

      correct:
        cell(
          colCorrect
        ),

      almost:
        cell(
          colAlmost
        ),

      little:
        cell(
          colLittle
        ),

      wrong:
        cell(
          colWrong
        )

    };


    /*
      Vi krever bare emne,
      spørsmål og riktig svar.

      Modul og tema kan være hva som helst.
    */

    if(
      row.course &&
      row.question &&
      row.correct
    ){

      rows.push(
        row
      );

    }

  }


  return rows;

}


/* =============================================
   BYGG SPØRSMÅLSBANKER

   Hver kombinasjon av

   EMNE + MODUL + TEMA

   blir én egen bank.
============================================= */

function buildQuestionBanks(rows){

  var groups = {};


  rows.forEach(
    function(row){

      var course =
        normalizeValue(
          row.course
        );


      var module =
        normalizeValue(
          row.module
        );


      var topic =
        normalizeValue(
          row.topic
        );


      var key =
        course +
        "||" +
        module +
        "||" +
        topic;


      if(
        !groups[key]
      ){

        groups[key] = {

          course:
            course,

          module:
            module,

          topic:
            topic,

          items:
            []

        };

      }


      groups[key].items.push({

        index:
          row.index,

        question:
          row.question,

        correct:
          row.correct,

        almost:
          row.almost,

        little:
          row.little,

        wrong:
          row.wrong

      });

    }
  );


  var banks = [];


  Object.keys(
    groups
  ).forEach(
    function(key){

      var group =
        groups[key];


      /*
        Sorter spørsmålene etter
        indeksnummer i CSV.
      */

      group.items.sort(
        function(a,b){

          var ia =
            parseInt(
              a.index,
              10
            );


          var ib =
            parseInt(
              b.index,
              10
            );


          if(
            isNaN(ia)
          ){

            ia = 999999;

          }


          if(
            isNaN(ib)
          ){

            ib = 999999;

          }


          return ia - ib;

        }
      );


      /*
        Maks 30 spørsmål i ett hjul.
      */

      group.items =
        group.items.slice(
          0,
          MAX
        );


      banks.push({

        course:
          group.course,

        module:
          group.module,

        topic:
          group.topic,

        name:
          [
            group.module,
            group.topic
          ]
          .filter(Boolean)
          .join(" "),

        items:
          group.items

      });

    }
  );


  /*
    Sorter banker:
    først emne,
    så modul,
    så tema.
  */

  banks.sort(
    function(a,b){

      var courseCompare =
        a.course.localeCompare(
          b.course,
          "no",
          {
            numeric:true
          }
        );


      if(
        courseCompare !== 0
      ){

        return courseCompare;

      }


      var moduleCompare =
        a.module.localeCompare(
          b.module,
          "no",
          {
            numeric:true
          }
        );


      if(
        moduleCompare !== 0
      ){

        return moduleCompare;

      }


      return a.topic.localeCompare(
        b.topic,
        "no",
        {
          numeric:true
        }
      );

    }
  );


  return banks;

}


/* =============================================
   BYGG EMNELISTE
============================================= */

function buildCourseList(){

  var found = {};


  questionBanks.forEach(
    function(bank){

      if(
        bank.course
      ){

        found[
          bank.course
        ] = true;

      }

    }
  );


  courses =
    Object.keys(
      found
    );


  courses.sort(
    function(a,b){

      return a.localeCompare(
        b,
        "no",
        {
          numeric:true
        }
      );

    }
  );

}


/* =============================================
   LAST SPØRSMÅLSBANK
============================================= */

async function loadQuestionCSV(){

  var lastError =
    null;


  for(
    var i=0;
    i<QUESTION_CSV_PATHS.length;
    i++
  ){

    var path =
      QUESTION_CSV_PATHS[
        i
      ];


    try{

      var response =
        await fetch(
          path +
          "?v=" +
          Date.now(),
          {
            cache:"no-store"
          }
        );


      if(
        !response.ok
      ){

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      var text =
        await response.text();


      var rows =
        parseQuestionCSV(
          text
        );


      questionBanks =
        buildQuestionBanks(
          rows
        );


      if(
        questionBanks.length === 0
      ){

        throw new Error(
          "Ingen spørsmålsbanker funnet."
        );

      }


      buildCourseList();


      refreshCourseList();


      el(
        "questionStatus"
      ).textContent =
        "Spørsmålsbank lastet: " +
        rows.length +
        " spørsmål / " +
        questionBanks.length +
        " banker";


      /*
        Litt feilsøkingsinfo i konsollen.

        Her skal vi kunne se MASG2103/M2
        dersom CSV-filen er riktig lest.
      */

      console.log(
        "Emner:",
        courses
      );


      console.log(
        "Spørsmålsbanker:",
        questionBanks
      );


      return;

    }

    catch(error){

      lastError =
        error;


      console.log(
        "Spørsmålsfil:",
        path,
        error
      );

    }

  }


  el(
    "courseSelect"
  ).innerHTML =
    "<option>Spørsmålsbank mangler</option>";


  el(
    "topicSelect"
  ).innerHTML =
    "<option>Ingen modul/tema</option>";


  questions = [];

  answers = [];

  almostAnswers = [];

  littleAnswers = [];

  wrongAnswers = [];


  console.error(
    "Kunne ikke laste spørsmålsbanken:",
    lastError
  );


  drawAll();

}


/* =============================================
   EMNEMENY
============================================= */

function refreshCourseList(){

  var select =
    el(
      "courseSelect"
    );


  select.innerHTML =
    "";


  courses.forEach(
    function(course){

      var option =
        document.createElement(
          "option"
        );


      option.value =
        course;


      option.textContent =
        course;


      select.appendChild(
        option
      );

    }
  );


  if(
    courses.length > 0
  ){

    /*
      Forsøk å starte med MASG2103
      hvis det finnes.
    */

    if(
      courses.indexOf(
        "MASG2103"
      ) !== -1
    ){

      select.value =
        "MASG2103";

    }
    else{

      select.value =
        courses[0];

    }


    loadCourse();

  }

}


/* =============================================
   VELG EMNE
============================================= */

window.loadCourse =
function(){

  var selectedCourse =
    normalizeValue(
      el(
        "courseSelect"
      ).value
    );


  visibleQuestionBanks =
    [];


  questionBanks.forEach(
    function(bank){

      if(
        normalizeValue(
          bank.course
        ) === selectedCourse
      ){

        visibleQuestionBanks.push(
          bank
        );

      }

    }
  );


  /*
    Sorter bare bankene
    i valgt emne.
  */

  visibleQuestionBanks.sort(
    function(a,b){

      var moduleCompare =
        a.module.localeCompare(
          b.module,
          "no",
          {
            numeric:true
          }
        );


      if(
        moduleCompare !== 0
      ){

        return moduleCompare;

      }


      return a.topic.localeCompare(
        b.topic,
        "no",
        {
          numeric:true
        }
      );

    }
  );


  console.log(
    "Valgt emne:",
    selectedCourse
  );


  console.log(
    "Banker i valgt emne:",
    visibleQuestionBanks
  );


  refreshTopicList();

};


/* =============================================
   MODUL / TEMA-MENY
============================================= */

function refreshTopicList(){

  var select =
    el(
      "topicSelect"
    );


  select.innerHTML =
    "";


  visibleQuestionBanks.forEach(
    function(
      bank,
      index
    ){

      var option =

          "option"
        );


      option.value =
        index;


      option.textContent =
        bank.name;


      select.appendChild(
        option
      );

    }
  );


  if(
    visibleQuestionBanks.length > 0
  ){

    select.value =
      0;


    loadQuestions();

  }
  else{

    select.innerHTML =
      "<option>Ingen modul/tema funnet</option>";


    questions = [];

    answers = [];

    almostAnswers = [];

    littleAnswers = [];

    wrongAnswers = [];


    resetQuestionSession();

  }

}

/* =============================================
   FINN LEDIG FELT
============================================= */

function getAvailableIndex(
  count,
  used
){

  if(
    count <= 0
  ){

    return -1;

  }


  var available =
    [];


  for(
    var i=0;
    i<count;
    i++
  ){

    if(
      used.indexOf(
        i
      ) === -1
    ){

      available.push(
        i
      );

    }

  }


  /*
    Når alle er brukt,
    startes ny tilfeldig gjennomkjøring.
  */

  if(
    available.length === 0
  ){

    used.length =
      0;


    for(
      var j=0;
      j<count;
      j++
    ){

      available.push(
        j
      );

    }

  }


  return available[
    Math.floor(
      Math.random() *
      available.length
    )
  ];

}


/* =============================================
   TEGN HJUL
============================================= */

function drawWheel(
  ctx,
  canvas,
  labels,
  used,
  angle
){

  var width =
    canvas.width;


  var height =
    canvas.height;


  var cx =
    width /
    2;


  var cy =
    height /
    2;


  var radius =
    Math.min(
      width,
      height
    ) /
    2 -
    8;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  if(
    !labels ||
    labels.length === 0
  ){

    ctx.beginPath();


    ctx.arc(
      cx,
      cy,
      radius,
      0,
      Math.PI *
      2
    );


    ctx.fillStyle =
      "#dddddd";


    ctx.fill();


    return;

  }


  var count =
    labels.length;


  var slice =
    Math.PI *
    2 /
    count;


  for(
    var i=0;
    i<count;
    i++
  ){

    var start =
      angle +
      i *
      slice -
      Math.PI /
      2;


    var end =
      start +
      slice;


    ctx.beginPath();


    ctx.moveTo(
      cx,
      cy
    );


    ctx.arc(
      cx,
      cy,
      radius,
      start,
      end
    );


    ctx.closePath();


    if(
      used.indexOf(
        i
      ) !== -1
    ){

      ctx.fillStyle =
        "#b7b7b7";

    }
    else{

      ctx.fillStyle =
        i % 2 === 0
        ?
        "#78b7e5"
        :
        "#d5eaff";

    }


    ctx.fill();


    ctx.strokeStyle =
      "#ffffff";


    ctx.lineWidth =
      2;


    ctx.stroke();


    ctx.save();


    ctx.translate(
      cx,
      cy
    );


    ctx.rotate(
      start +
      slice /
      2
    );


    ctx.textAlign =
      "right";


    ctx.textBaseline =
      "middle";


    ctx.fillStyle =
      "#111";


    var fontSize =
      count >
      24
      ?
      13
      :
      15;


    ctx.font =
      fontSize +
      "px Arial";


    ctx.fillText(
      String(
        labels[i] ||
        ""
      ),
      radius -
      18,
      0
    );


    ctx.restore();

  }


  /*
    Sirkel i sentrum.
  */

  ctx.beginPath();


  ctx.arc(
    cx,
    cy,
    24,
    0,
    Math.PI *
    2
  );


  ctx.fillStyle =
    "#ffffff";


  ctx.fill();


  ctx.strokeStyle =
    "#333333";


  ctx.lineWidth =
    2;


  ctx.stroke();

}


/* =============================================
   STUDENTHJUL
============================================= */

function drawStudentWheel(){

  drawWheel(
    sctx,
    sc,
    names,
    usedStudents,

/* =============================================

function drawQuestionWheel(){

    i<questions.length;
    i++
  ){

    labels.push(

        i +
        1
      )
    );

  }


  drawWheel(

    qc,

    usedQuestions,
    questionAngle
  );

}

============================================= */

function drawAll(){

  drawQuestionWheel();

}


/*
=================================================
SLUTT DEL 2 AV 3
=================================================
*//* =============================================
   SPINN STUDENTHJUL
============================================= */

function spinStudent(){

  if(spinning){
    return;
  }

  if(
    !names ||
    names.length === 0
  ){

    alert(
      "Ingen studentgruppe er lastet."
    );

    return;
  }


  var chosen =
    getAvailableIndex(
      names.length,
      usedStudents
    );


  if(chosen < 0){
    return;
  }


  spinning = true;


  var startAngle =
    studentAngle;


  var count =
    names.length;


  var slice =
    Math.PI *
    2 /
    count;


  /*
    Pekeren står øverst.

    Valgt felt roteres
    inn under pekeren.
  */

  var targetPosition =
    -(
      chosen *
      slice +
      slice /
      2
    );


  /*
    Flere hele rotasjoner
    før stopp.
  */

  var rotations =
    Math.PI *
    2 *
    7;


  var finalAngle =
    targetPosition +
    rotations;


  var duration =
    2500;


  var startTime =
    null;


  function animate(time){

    if(
      startTime === null
    ){

      startTime =
        time;
    }


    var progress =
      Math.min(
        (
          time -
          startTime
        ) /
        duration,
        1
      );


    /*
      Myk retardasjon.
    */

    var eased =
      1 -
      Math.pow(
        1 -
        progress,
        3
      );


    studentAngle =
      startAngle +
      (
        finalAngle -
        startAngle
      ) *
      eased;


    drawStudentWheel();


    if(
      progress < 1
    ){

      requestAnimationFrame(
        animate
      );

    }
    else{

      usedStudents.push(
        chosen
      );


      el(
        "studentResult"
      ).textContent =
        "Valgt student: " +
        names[
          chosen
        ];


      spinning = false;


      drawStudentWheel();

    }

  }


  requestAnimationFrame(
    animate
  );

}


/* =============================================
   SPINN SPØRSMÅLSHJUL
============================================= */

function spinQuestion(){

  if(spinning){
    return;
  }


  if(
    !questions ||
    questions.length === 0
  ){

    alert(
      "Ingen spørsmålsbank er valgt."
    );

    return;
  }


  var chosen =
    getAvailableIndex(
      questions.length,
      usedQuestions
    );


  if(chosen < 0){
    return;
  }


  spinning = true;


  /*
    Skjul forrige svar
    når nytt spørsmål trekkes.
  */

  el(
    "answerText"
  ).classList.add(
    "hidden"
  );


  var startAngle =
    questionAngle;


  var count =
    questions.length;


  var slice =
    Math.PI *
    2 /
    count;


  var targetPosition =
    -(
      chosen *
      slice +
      slice /
      2
    );


  var rotations =
    Math.PI *
    2 *
    7;


  var finalAngle =
    targetPosition +
    rotations;


  var duration =
    2500;


  var startTime =
    null;


  function animate(time){

    if(
      startTime === null
    ){

      startTime =
        time;
    }


    var progress =
      Math.min(
        (
          time -
          startTime
        ) /
        duration,
        1
      );


    var eased =
      1 -
      Math.pow(
        1 -
        progress,
        3
      );


    questionAngle =
      startAngle +
      (
        finalAngle -
        startAngle
      ) *
      eased;


    drawQuestionWheel();


    if(
      progress < 1
    ){

      requestAnimationFrame(
        animate
      );

    }
    else{

      usedQuestions.push(
        chosen
      );


      selectedQuestion =
        chosen;


      el(
        "questionResult"
      ).textContent =
        "Valgt spørsmål: " +
        (
          chosen +
          1
        );


      el(
        "questionText"
      ).textContent =
        questions[
          chosen
        ];


      el(
        "questionText"
      ).classList.remove(
        "hidden"
      );


      el(
        "answerText"
      ).textContent =
        "";


      el(
        "answerText"
      ).classList.add(
        "hidden"
      );


      spinning = false;


      drawQuestionWheel();

    }

  }


  requestAnimationFrame(
    animate
  );

}


/* =============================================
   VIS SVAR
============================================= */

function showAnswer(){

  if(
    selectedQuestion < 0
  ){

    alert(
      "Velg spørsmål først."
    );

    return;
  }


  var answer =
    answers[
      selectedQuestion
    ] || "";


  if(
    !answer
  ){

    answer =
      "Åpent spørsmål – ingen fasit registrert.";

  }


  el(
    "answerText"
  ).textContent =
    answer;


  el(
    "answerText"
  ).classList.remove(
    "hidden"
  );

}
