<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selvtest v1.10</title>
<style>
:root{--red:#ef4444;--yellow:#fde047;--orange:#fb923c;--green:#4ade80;--ink:#13213a;--line:#24334d;--blue:#e8f5ff}
*{box-sizing:border-box}
body{margin:0;background:#eef3f8;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.app{max-width:1400px;margin:18px auto;padding:0 12px}
.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:10px}
.topbtn{min-height:66px;border:2px solid var(--line);border-radius:11px;background:#fff;font-size:20px;font-weight:700;cursor:pointer}
.topbtn.primary{background:#dfeffc}.topbtn.finish{background:#fff1bf}.topbtn.copy{background:#e8f5ec}
.topbtn:disabled{opacity:.45;cursor:not-allowed}
.total{text-align:center;font-size:20px;font-weight:700;margin:8px 0 18px}
.board{display:grid;grid-template-columns:minmax(0,1fr) 370px;border:2px solid var(--line);background:#fff}
.main{border-right:2px solid var(--line);min-width:0}
.header{display:grid;grid-template-columns:1.05fr .55fr 1.55fr .85fr;border-bottom:2px solid var(--line);background:#f8fafc}
.header div{padding:17px 18px;border-right:1px solid var(--line);font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header div:last-child{border-right:0;text-align:center}
.question{min-height:170px;padding:28px;background:var(--blue);border-bottom:2px solid var(--line);font-size:26px;font-weight:700;display:flex;align-items:center;line-height:1.3}
.answers{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.answer{min-height:150px;border:3px solid #70798a;border-radius:11px;background:#fff;padding:20px;text-align:left;font-size:21px;cursor:pointer;position:relative}
.answer:hover:not(:disabled){background:#f8fafc}.answer:disabled{color:var(--ink);cursor:default}
.answer .letter{font-size:27px;font-weight:800;margin-right:10px}
.answer.r100{background:#dcfce7;border-color:var(--green)}.answer.r75{background:#ffedd5;border-color:var(--orange)}
.answer.r25{background:#fef9c3;border-color:var(--yellow)}.answer.r0{background:#fee2e2;border-color:var(--red)}
.answer.selected{box-shadow:0 0 0 4px #2563eb inset}.scoretag{display:none;position:absolute;right:12px;bottom:9px;font-weight:800}
.answer.revealed .scoretag{display:block}
.legend{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:2px solid var(--line)}
.legend div{text-align:center;padding:17px 3px;font-size:20px;font-weight:800;border-right:1px solid var(--line)}
.legend div:last-child{border-right:0}.l0{background:#fecaca}.l25{background:#fef08a}.l75{background:#fed7aa}.l100{background:#bbf7d0}
.progress{display:grid;grid-template-columns:repeat(4,1fr)}
.cell{height:67px;display:flex;align-items:center;justify-content:center;border-right:1px solid #a7b0bf;border-bottom:1px solid #a7b0bf;font-size:19px}
.cell:nth-child(4n){border-right:0}.cell.current{outline:4px solid #2563eb;outline-offset:-4px;font-weight:800}
.cell.s0{background:#fecaca}.cell.s25{background:#fef08a}.cell.s75{background:#fed7aa}.cell.s100{background:#bbf7d0}
.promptbox{margin-top:16px;border:2px solid var(--line);border-radius:11px;background:#fff;padding:16px}
.promptbox h3{margin:0 0 10px}.promptbox textarea{width:100%;min-height:190px;padding:12px;border:1px solid #8994a5;border-radius:8px;font:15px/1.4 Arial;background:#fff;color:#111}
.status{min-height:24px;margin-top:9px;font-weight:700}.error{color:#b91c1c}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.hidden{display:none}
.dialog{width:min(560px,100%);background:#fff;border-radius:14px;padding:22px;box-shadow:0 20px 60px #0005}
.dialog h2{margin-top:0}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field select{width:100%;padding:11px;border:1px solid #9ca3af;border-radius:7px;background:#fff}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.actions button{padding:10px 16px;border:1px solid var(--line);border-radius:8px;font-weight:700;cursor:pointer}
.note{font-size:13px;color:#475569;line-height:1.35}
@media(max-width:800px){.toolbar{grid-template-columns:1fr 1fr}.board{grid-template-columns:1fr}.main{border-right:0;border-bottom:2px solid var(--line)}.answers{grid-template-columns:1fr}.header{grid-template-columns:1fr 1fr}.question{font-size:21px}}
</style>
</head>
<body>
<div class="app">
 <div class="toolbar">
  <button id="newSession" class="topbtn">Ny økt</button>
  <button id="nextQuestion" class="topbtn primary" disabled>Nytt spørsmål</button>
  <button id="finish" class="topbtn finish" disabled>Poeng ved ferdig økt</button>
  <button id="copyPrompt" class="topbtn copy" disabled>Klipp ut prompt</button>
 </div>
 <div id="total" class="total">Laster spørsmålsbank …</div>

 <div class="board">
  <section class="main">
   <div class="header"><div id="course">Emne</div><div id="module">Modul</div><div id="topic">Tema</div><div>Selvtest</div></div>
   <div id="question" class="question">Laster sporsmalsbank.csv …</div>
   <div id="answers" class="answers"></div>
  </section>
  <aside>
   <div class="legend"><div class="l0">0</div><div class="l25">25</div><div class="l75">75</div><div class="l100">100</div></div>
   <div id="progress" class="progress"></div>
  </aside>
 </div>

 <div class="promptbox">
  <h3>Felt 11 – AI-prompt</h3>
  <textarea id="prompt" readonly placeholder="Prompt genereres når økten avsluttes."></textarea>
  <div id="status" class="status"></div>
 </div>
</div>

<div id="modal" class="modal hidden">
 <div class="dialog">
  <h2>Ny økt</h2>
  <div class="field"><label>Emne</label><select id="selCourse"></select></div>
  <div class="field"><label>Modul</label><select id="selModule"></select></div>
  <div class="field"><label>Tema</label><select id="selTopic"></select></div>
  <div class="note">Det trekkes inntil 30 tilfeldige spørsmål fra valgt tema. Hvert spørsmål brukes én gang i økten.</div>
  <div class="actions"><button id="cancelModal">Avbryt</button><button id="startSession">Start ny økt</button></div>
 </div>
</div>

<script>
/* Felles spørsmålsbank for Studenthjul og Selvtest.
   Legg denne HTML-filen i samme GitHub-mappe som sporsmalsbank.csv. */
const CSV_FILE = "sporsmalsbank.csv";

let BANK=[], session=null;
const $=id=>document.getElementById(id);
const uniq=a=>[...new Set(a.filter(v=>v!==""))].sort((a,b)=>String(a).localeCompare(String(b),"no",{numeric:true}));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function detectDelimiter(text){
 const line=text.split(/\r?\n/).find(x=>x.trim())||"";
 let semi=0,comma=0,quoted=false;
 for(let i=0;i<line.length;i++){if(line[i]==='"')quoted=!quoted; else if(!quoted&&line[i]===';')semi++; else if(!quoted&&line[i]===',')comma++;}
 return semi>=comma?";":",";
}
function parseCSV(text){
 text=text.replace(/^\uFEFF/,"");
 const d=detectDelimiter(text), rows=[]; let row=[],field="",quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i],n=text[i+1];
  if(c==='"'){
   if(quoted&&n==='"'){field+='"';i++;} else quoted=!quoted;
  }else if(c===d&&!quoted){row.push(field);field="";}
  else if((c==="\n"||c==="\r")&&!quoted){
   if(c==="\r"&&n==="\n")i++;
   row.push(field);field="";
   if(row.some(x=>x.trim()!==""))rows.push(row);
   row=[];
  }else field+=c;
 }
 if(field!==""||row.length){row.push(field);if(row.some(x=>x.trim()!==""))rows.push(row);}
 if(rows.length<2)return [];
 const head=rows[0].map(x=>x.trim());
 return rows.slice(1).map(r=>{
   const o={};head.forEach((h,i)=>o[h]=(r[i]??"").trim());return o;
 }).filter(o=>o["Spørsmål"]);
}
async function loadBank(){
 try{
  const res=await fetch(CSV_FILE+"?v="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const text=await res.text();
  BANK=parseCSV(text);
  const required=["Emne","Modul","Tema","Spørsmål","Riktig svar","Nesten riktig","Litt riktig","Feil svar","Stikkord"];
  const missing=required.filter(k=>!BANK.length||!(k in BANK[0]));
  if(missing.length)throw new Error("Mangler kolonne(r): "+missing.join(", "));
  populateCourse();
  $("total").textContent=`Spørsmålsbank lastet: ${BANK.length} spørsmål`;
  $("question").textContent="Trykk «Ny økt» for å starte.";
  $("newSession").disabled=false;
  openModal();
 }catch(e){
  $("total").innerHTML='<span class="error">Kunne ikke laste sporsmalsbank.csv</span>';
  $("question").innerHTML='<span class="error">Kontroller at selvtest_v110.html og sporsmalsbank.csv ligger i samme GitHub-mappe, og at siden åpnes via GitHub Pages.</span>';
  $("status").textContent=e.message;
  $("status").className="status error";
 }
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function initProgress(){ $("progress").innerHTML="";for(let i=1;i<=30;i++){const d=document.createElement("div");d.className="cell";d.id="cell"+i;d.textContent=i;$("progress").appendChild(d)}}
function populateCourse(){
 $("selCourse").innerHTML=uniq(BANK.map(q=>q.Emne)).map(v=>`<option>${esc(v)}</option>`).join("");populateModule();
}
function populateModule(){
 const c=$("selCourse").value;$("selModule").innerHTML=uniq(BANK.filter(q=>q.Emne===c).map(q=>q.Modul)).map(v=>`<option>${esc(v)}</option>`).join("");populateTopic();
}
function populateTopic(){
 const c=$("selCourse").value,m=$("selModule").value;$("selTopic").innerHTML=uniq(BANK.filter(q=>q.Emne===c&&q.Modul===m).map(q=>q.Tema)).map(v=>`<option>${esc(v)}</option>`).join("");
}
function openModal(){if(BANK.length)$("modal").classList.remove("hidden")}
function closeModal(){if(session)$("modal").classList.add("hidden")}
function startSession(){
 const course=$("selCourse").value,module=$("selModule").value,topic=$("selTopic").value;
 const pool=shuffle(BANK.filter(q=>q.Emne===course&&q.Modul===module&&q.Tema===topic)).slice(0,30);
 if(!pool.length){alert("Ingen spørsmål funnet.");return}
 session={course,module,topic,pool,index:0,current:null,answered:false,currentScore:null,results:[],finished:false};
 $("course").textContent=course;$("module").textContent=module;$("topic").textContent=topic;
 $("prompt").value="";$("status").textContent="";$("status").className="status";
 $("copyPrompt").disabled=true;$("finish").disabled=false;$("nextQuestion").disabled=true;
 initProgress();$("modal").classList.add("hidden");updateTotal();showQuestion();
}
function showQuestion(){
 if(!session||session.index>=session.pool.length){finishSession();return}
 session.current=session.pool[session.index];session.answered=false;session.currentScore=null;
 $("question").textContent=session.current["Spørsmål"];
 document.querySelectorAll(".cell").forEach(c=>c.classList.remove("current"));
 const cell=$("cell"+(session.index+1));if(cell)cell.classList.add("current");
 const opts=shuffle([
  {text:session.current["Riktig svar"],score:100},{text:session.current["Nesten riktig"],score:75},
  {text:session.current["Litt riktig"],score:25},{text:session.current["Feil svar"],score:0}
 ]);
 $("answers").innerHTML="";
 opts.forEach((o,i)=>{
  const b=document.createElement("button");b.className="answer";
  b.innerHTML=`<span class="letter">${"ABCD"[i]}</span>${esc(o.text)}<span class="scoretag">${o.score} P</span>`;
  b.onclick=()=>answer(o.score,b);$("answers").appendChild(b);
 });
 $("nextQuestion").disabled=true;
}
function answer(score,chosen){
 if(!session||session.answered||session.finished)return;
 session.answered=true;session.currentScore=score;
 [...$("answers").children].forEach(b=>{const s=parseInt(b.querySelector(".scoretag").textContent);b.classList.add("revealed","r"+s);b.disabled=true});
 chosen.classList.add("selected");$("nextQuestion").disabled=false;
 $("status").textContent=`Svar valgt: ${score} poeng. Trykk «Nytt spørsmål» for å gå videre.`;
}
function commitCurrent(){
 if(!session||!session.answered)return false;
 const q=session.current,score=session.currentScore;
 session.results.push({score,keyword:(q["Stikkord"]||"Uten stikkord").trim()||"Uten stikkord"});
 const cell=$("cell"+(session.index+1));if(cell){cell.classList.remove("current");cell.classList.add("s"+score);cell.textContent=score}
 session.index++;updateTotal();return true;
}
function nextQuestion(){if(!commitCurrent())return;$("status").textContent="";if(session.index>=session.pool.length)finishSession();else showQuestion()}
function updateTotal(){
 if(!session)return;const got=session.results.reduce((s,r)=>s+r.score,0),max=session.results.length*100,pct=max?Math.round(got/max*100):0;
 $("total").textContent=`${got} av ${max} poeng (${pct} %) • ${session.results.length} av ${session.pool.length} spørsmål besvart`;
}
function finishSession(){
 if(!session||session.finished)return;
 if(session.answered)commitCurrent();
 if(!session.results.length){alert("Svar på minst ett spørsmål før økten avsluttes.");return}
 session.finished=true;$("nextQuestion").disabled=true;$("finish").disabled=true;
 [...$("answers").children].forEach(b=>b.disabled=true);document.querySelectorAll(".cell").forEach(c=>c.classList.remove("current"));updateTotal();
 const got=session.results.reduce((s,r)=>s+r.score,0),max=session.results.length*100,groups={};
 session.results.forEach(r=>{if(!groups[r.keyword])groups[r.keyword]={got:0,max:0};groups[r.keyword].got+=r.score;groups[r.keyword].max+=100});
 const lines=Object.entries(groups).sort((a,b)=>(a[1].got/a[1].max)-(b[1].got/b[1].max)).map(([k,v])=>`"${k}": ${v.got} av ${v.max} oppnåelige poeng`);
 $("prompt").value=[
  `Jeg har gjennomført en selvtest i emnet "${session.course}", modul "${session.module}", med tema "${session.topic}".`,
  `Min totale score ble ${got} av ${max} oppnåelige poeng.`,
  `Resultatene mine fordelt på stikkord ble:`,...lines,"",
  `Gi meg en faglig oppdatering basert på prestasjonene mine i denne testen. Prioriter stikkordene der jeg har lavest relativ score. Forklar hva jeg bør forstå bedre, og gi meg noen korte kontrollspørsmål.`
 ].join("\n");
 $("copyPrompt").disabled=false;$("status").textContent="Økten er avsluttet. Resultat og AI-prompt er ferdig.";
}
async function copyPrompt(){
 const t=$("prompt").value;if(!t)return;
 try{await navigator.clipboard.writeText(t);$("status").textContent="AI-prompt er kopiert til utklippstavlen."}
 catch(e){$("prompt").select();document.execCommand("copy");$("status").textContent="AI-prompt er kopiert."}
}
$("newSession").disabled=true;$("newSession").onclick=openModal;$("nextQuestion").onclick=nextQuestion;$("finish").onclick=finishSession;$("copyPrompt").onclick=copyPrompt;
$("startSession").onclick=startSession;$("cancelModal").onclick=closeModal;$("selCourse").onchange=populateModule;$("selModule").onchange=populateTopic;
initProgress();loadBank();
</script>
</body>
</html>
