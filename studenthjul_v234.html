<style>

  }

  select.bankSelect{
    font-size:18px;
    min-width:260px;

</style>

<header>

<div class="selectRow">

<script>

(function(){

"use strict";

var MAX = 30;


/*
=================================================
FILNAVN PÅ GITHUB
=================================================
*/

var STUDENT_CSV_PATHS = [
  "studenter.csv",
  "data/studenter.csv"
];

/*
Vi prøver begge skrivemåter.

Anbefalt filnavn på sikt:
sporsmalsbank.csv
*/

var QUESTION_CSV_PATHS = [
  "spørsmålsbank.csv",
  "sporsmalsbank.csv",
  "data/spørsmålsbank.csv",
  "data/sporsmalsbank.csv"
];


/*
=================================================
DATA
=================================================
*/

var classBanks = [];
var questionBanks = [];

var names = [];
var questions = [];
var answers = [];

/*
Disse tre brukes ikke av Studenthjulet ennå,
men leses fra CSV og lagres for senere bruk
i Spørsmålstrommelen.
*/

var almostAnswers = [];
var littleAnswers = [];
var wrongAnswers = [];

var usedStudents = [];
var usedQuestions = [];

var selectedQuestion = -1;

var spinning = false;

var studentAngle = 0;
var questionAngle = 0;


/*
=================================================
CANVAS
=================================================
*/

var sc = document.getElementById("studentCanvas");
var qc = document.getElementById("questionCanvas");

var sctx = sc.getContext("2d");
var qctx = qc.getContext("2d");

function el(id){
  return document.getElementById(id);
}


/*
=================================================
GENERELLE CSV-FUNKSJONER
=================================================
*/

function cleanText(text){

  if(text && text.charCodeAt(0) === 0xFEFF){
    text = text.slice(1);
  }

  return text;
}


/*
Norsk Excel bruker ofte semikolon.
Andre CSV-filer bruker komma.
*/

function detectDelimiter(firstLine){

  var semicolonCount =
    (firstLine.match(/;/g) || []).length;

  var commaCount =
    (firstLine.match(/,/g) || []).length;

  return semicolonCount > commaCount ? ";" : ",";
}


/*
Les én CSV-rad.

Denne håndterer også:
"tekst, med komma"
og
"tekst; med semikolon"
*/

function parseCSVLine(line,delimiter){

  var result = [];
  var current = "";
  var inQuotes = false;

  for(var i=0;i<line.length;i++){

    var ch = line[i];

    if(ch === '"'){

      if(
        inQuotes &&
        line[i+1] === '"'
      ){
        current += '"';
        i++;
      }
      else{
        inQuotes = !inQuotes;
      }

    }
    else if(
      ch === delimiter &&
      !inQuotes
    ){
      result.push(current.trim());
      current = "";
    }
    else{
      current += ch;
    }

  }

  result.push(current.trim());

  return result;
}


/*
Gjør kolonnenavn robuste.

Eksempel:

"Riktig svar" -> "riktigsvar"
"Riktig Svar " -> "riktigsvar"
*/

function normalizeHeader(text){

  return String(text || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g,"");
}


/*
=================================================
LES STUDENTER.CSV
=================================================
*/

function parseStudentCSV(text){

  text = cleanText(text);

  var lines = text
    .split(/\r?\n/)
    .filter(function(line){
      return line.trim() !== "";
    });

  if(lines.length < 2){
    throw new Error(
      "CSV-filen inneholder ingen studentdata."
    );
  }

  var delimiter =
    detectDelimiter(lines[0]);

  var headers =
    parseCSVLine(lines[0],delimiter)
    .map(normalizeHeader);

  var index = {};

  headers.forEach(function(header,i){
    index[header] = i;
  });

  if(index.fornavn === undefined){
    throw new Error(
      "Fant ikke kolonnen 'Fornavn'."
    );
  }

  var rows = [];

  for(var r=1;r<lines.length;r++){

    var cells =
      parseCSVLine(lines[r],delimiter);

    function value(column){

      if(index[column] === undefined){
        return "";
      }

      return String(
        cells[index[column]] || ""
      ).trim();
    }

    var row = {
      emne:value("emne"),
      studieprogram:value("studieprogram"),
      kull:value("kull"),
      gruppe:value("gruppe"),
      fornavn:value("fornavn"),
      etternavn:value("etternavn")
    };

    if(row.fornavn){
      rows.push(row);
    }
  }

  return rows;
}
  /*
=================================================
BYGG KLASSEBANKER FRA STUDENTDATA
=================================================
*/

function buildClassBanks(rows){

  var groups = {};

  rows.forEach(function(student){

    var program =
      student.studieprogram || "Klasse";

    var kull =
      student.kull || "";

    var gruppe =
      student.gruppe || "";

    var key =
      program + "|" +
      kull + "|" +
      gruppe;

    if(!groups[key]){

      groups[key] = {
        studieprogram:program,
        kull:kull,
        gruppe:gruppe,
        students:[]
      };

    }

    groups[key].students.push({
      first:student.fornavn,
      last:student.etternavn
    });

  });


  var banks = [];


  Object.keys(groups).forEach(function(key){

    var group =
      groups[key];

    var firstNameCount = {};

    group.students.forEach(function(student){

      var n =
        student.first.toLowerCase();

      firstNameCount[n] =
        (firstNameCount[n] || 0) + 1;

    });


    var studentNames =
      group.students.map(function(student){

        var sameName =
          firstNameCount[
            student.first.toLowerCase()
          ] > 1;

        if(
          sameName &&
          student.last
        ){

          return student.first +
            " " +
            student.last.charAt(0) +
            ".";
        }

        return student.first;

      });


    studentNames =
      studentNames.filter(
        function(name,index,array){

          return array.indexOf(name) === index;

        }
      );


    studentNames =
      studentNames.slice(0,MAX);


    var displayKull =
      String(group.kull || "");

    if(displayKull.length === 4){

      displayKull =
        displayKull.slice(2);

    }


    var displayName =
      [
        group.studieprogram,
        displayKull,
        group.gruppe
      ]
      .filter(Boolean)
      .join(" ");


    banks.push({
      name:displayName,
      students:studentNames
    });

  });


  banks.sort(function(a,b){

    return a.name.localeCompare(
      b.name,
      "no",
      {numeric:true}
    );

  });


  return banks;
}


/*
=================================================
LAST STUDENTER.CSV
=================================================
*/

async function loadStudentCSV(){

  var lastError = null;


  for(
    var i=0;
    i<STUDENT_CSV_PATHS.length;
    i++
  ){

    var path =
      STUDENT_CSV_PATHS[i];

    try{

      var url =
        path +
        "?v=" +
        Date.now();


      var response =
        await fetch(url);


      if(!response.ok){

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      var text =
        await response.text();


      var rows =
        parseStudentCSV(text);


      classBanks =
        buildClassBanks(rows);


      if(classBanks.length === 0){

        throw new Error(
          "Ingen klasser ble funnet."
        );

      }


      refreshClassList();


      el("studentStatus").textContent =
        "Studentliste lastet: " +
        rows.length +
        " studenter / " +
        classBanks.length +
        " klasser";


      el("studentStatus").className =
        "dataStatus ok";


      return;

    }
    catch(error){

      lastError =
        error;

      console.log(
        "Kunne ikke lese " +
        path,
        error
      );

    }

  }


  el("classSelect").innerHTML =
    "<option>Studentliste mangler</option>";


  el("studentStatus").textContent =
    "Kunne ikke lese studenter.csv. " +
    (
      lastError ?
      lastError.message :
      ""
    );


  el("studentStatus").className =
    "dataStatus error";


  names = [];

  drawAll();
}


/*
=================================================
KLASSELISTE
=================================================
*/

function refreshClassList(){

  var select =
    el("classSelect");

  select.innerHTML = "";


  classBanks.forEach(
    function(bank,index){

      var option =
        document.createElement("option");

      option.value =
        index;

      option.textContent =
        bank.name;

      select.appendChild(option);

    }
  );


  if(classBanks.length > 0){

    select.value = 0;

    loadClass();

  }

}


window.loadClass =
function(){

  var index =
    parseInt(
      el("classSelect").value,
      10
    );


  var bank =
    classBanks[index];


  if(!bank){

    names = [];

    drawAll();

    return;
  }


  names =
    bank.students || [];


  resetSession();

};


/*
=================================================
LES SPØRSMÅLSBANK.CSV
=================================================

Forventede kolonner:

Indeks
Emne
Modul
Tema
Spørsmål
Riktig svar
Nesten riktig
Litt riktig
Feil svar
=================================================
*/

function parseQuestionCSV(text){

  text =
    cleanText(text);

  var lines =
    text
    .split(/\r?\n/)
    .filter(function(line){

      return line.trim() !== "";

    });


  if(lines.length < 2){

    throw new Error(
      "CSV-filen inneholder ingen spørsmål."
    );

  }


  var delimiter =
    detectDelimiter(
      lines[0]
    );


  var headers =
    parseCSVLine(
      lines[0],
      delimiter
    )
    .map(normalizeHeader);


  var index = {};

  headers.forEach(
    function(header,i){

      index[header] = i;

    }
  );


  /*
  Tillat noen alternative kolonnenavn,
  slik at CSV-filen blir litt mer robust.
  */

  function findHeader(names){

    for(
      var i=0;
      i<names.length;
      i++
    ){

      if(
        index[
          normalizeHeader(
            names[i]
          )
        ] !== undefined
      ){

        return index[
          normalizeHeader(
            names[i]
          )
        ];

      }

    }

    return undefined;
  }


  var colIndex =
    findHeader([
      "Indeks",
      "Index"
    ]);


  var colCourse =
    findHeader([
      "Emne",
      "Course"
    ]);


  var colModule =
    findHeader([
      "Modul",
      "Module"
    ]);


  var colTopic =
    findHeader([
      "Tema",
      "Topic"
    ]);


  var colQuestion =
    findHeader([
      "Spørsmål",
      "Sporsmal",
      "Question"
    ]);


  var colCorrect =
    findHeader([
      "Riktig svar",
      "Riktig",
      "Correct answer"
    ]);


  var colAlmost =
    findHeader([
      "Nesten riktig",
      "Nesten",
      "Almost correct"
    ]);


  var colLittle =
    findHeader([
      "Litt riktig",
      "Litt",
      "Partly correct"
    ]);


  var colWrong =
    findHeader([
      "Feil svar",
      "Feil",
      "Wrong answer"
    ]);


  /*
  Minimumskrav for Studenthjulet:
  Emne, Modul, Tema, Spørsmål og Riktig svar.
  */

  if(
    colCourse === undefined ||
    colModule === undefined ||
    colTopic === undefined ||
    colQuestion === undefined ||
    colCorrect === undefined
  ){

    throw new Error(
      "Fant ikke nødvendige kolonner i spørsmålsbanken."
    );

  }


  var rows = [];


  for(
    var r=1;
    r<lines.length;
    r++
  ){

    var cells =
      parseCSVLine(
        lines[r],
        delimiter
      );


    function value(col){

      if(col === undefined){
        return "";
      }

      return String(
        cells[col] || ""
      ).trim();

    }


    var row = {

      index:
        value(colIndex),

      course:
        value(colCourse),

      module:
        value(colModule),

      topic:
        value(colTopic),

      question:
        value(colQuestion),

      correct:
        value(colCorrect),

      almost:
        value(colAlmost),

      little:
        value(colLittle),

      wrong:
        value(colWrong)

    };


    if(
      row.question &&
      row.correct
    ){

      rows.push(row);

    }

  }


  return rows;
}


/*
=================================================
BYGG SPØRSMÅLSBANKER
=================================================

Spørsmål grupperes etter:

Emne + Modul + Tema

Eksempel:

TEK1210 | M4 | Friksjon
=================================================
*/

function buildQuestionBanks(rows){

  var groups = {};


  rows.forEach(
    function(row){

      var course =
        row.course || "EMNE";

      var module =
        row.module || "M1";

      var topic =
        row.topic || "Tema";


      var key =
        course + "|" +
        module + "|" +
        topic;


      if(!groups[key]){

        groups[key] = {

          course:course,
          module:module,
          topic:topic,

          items:[]

        };

      }


      groups[key].items.push({

        index:
          row.index,

        question:
          row.question,

        correct:
          row.correct,

        almost:
          row.almost,

        little:
          row.little,

        wrong:
          row.wrong

      });

    }
  );


  var banks = [];


  Object.keys(groups).forEach(
    function(key){

      var group =
        groups[key];


      /*
      Sorter etter indeks hvis indeks finnes.
      */

      group.items.sort(
        function(a,b){

          var ia =
            parseInt(
              a.index,
              10
            );

          var ib =
            parseInt(
              b.index,
              10
            );


          if(
            !isNaN(ia) &&
            !isNaN(ib)
          ){

            return ia - ib;

          }


          return 0;

        }
      );


      /*
      Maks 30 spørsmål per hjul.
      */

      group.items =
        group.items.slice(
          0,
          MAX
        );


      banks.push(group);

    }
  );


  /*
  Sorter bankene:
  først emne,
  så modulnummer,
  så tema.
  */

  banks.sort(
    function(a,b){

      var courseSort =
        a.course.localeCompare(
          b.course,
          "no",
          {numeric:true}
        );


      if(courseSort !== 0){

        return courseSort;

      }


      var moduleSort =
        moduleNumber(
          a.module
        ) -
        moduleNumber(
          b.module
        );


      if(moduleSort !== 0){

        return moduleSort;

      }


      return a.topic.localeCompare(
        b.topic,
        "no",
        {numeric:true}
      );

    }
  );


  return banks;
}


/*
=================================================
MODULNUMMER
=================================================
*/

function moduleNumber(module){

  var result =
    String(
      module || ""
    )
    .match(/\d+/);


  return result ?
    parseInt(
      result[0],
      10
    ) :
    999;
}


/*
=================================================
LAST SPØRSMÅLSBANK.CSV
=================================================
*/

async function loadQuestionCSV(){

  var lastError =
    null;


  for(
    var i=0;
    i<QUESTION_CSV_PATHS.length;
    i++
  ){

    var path =
      QUESTION_CSV_PATHS[i];


    try{

      var url =
        path +
        "?v=" +
        Date.now();


      var response =
        await fetch(url);


      if(!response.ok){

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      var text =
        await response.text();


      var rows =
        parseQuestionCSV(text);


      questionBanks =
        buildQuestionBanks(rows);


      if(
        questionBanks.length === 0
      ){

        throw new Error(
          "Ingen spørsmålsbanker ble funnet."
        );

      }


      refreshQuestionList();


      el(
        "questionStatus"
      ).textContent =
        "Spørsmålsbank lastet: " +
        rows.length +
        " spørsmål / " +
        questionBanks.length +
        " temaer";


      el(
        "questionStatus"
      ).className =
        "dataStatus ok";


      return;

    }
    catch(error){

      lastError =
        error;


      console.log(
        "Kunne ikke lese " +
        path,
        error
      );

    }

  }


  el(
    "questionSelect"
  ).innerHTML =
    "<option>Spørsmålsbank mangler</option>";


  el(
    "questionStatus"
  ).textContent =
    "Kunne ikke lese spørsmålsbank.csv. " +
    (
      lastError ?
      lastError.message :
      ""
    );


  el(
    "questionStatus"
  ).className =
    "dataStatus error";


  questions = [];
  answers = [];

  drawAll();
}


/*
=================================================
SPØRSMÅLSBANKMENY
=================================================
*/

function questionBankName(bank){

  return [
    bank.course,
    bank.module,
    bank.topic
  ]
  .filter(Boolean)
  .join(" ");

}


function refreshQuestionList(){

  var select =
    el("questionSelect");

  select.innerHTML = "";


  questionBanks.forEach(
    function(bank,index){

      var option =
        document.createElement("option");

      option.value =
        index;

      option.textContent =
        questionBankName(bank);

      select.appendChild(option);

    }
  );


  if(
    questionBanks.length > 0
  ){

    select.value = 0;

    loadQuestions();

}

};/*
=================================================
HJULFUNKSJONER
=================================================
*/

function emptyIndexes(list){

  var empty = [];

  for(var i=0; i<MAX; i++){

    if(!list[i]){
      empty.push(i);
    }

  }

  return empty;
}


function padded(list){

  var result = [];

  for(var i=0; i<MAX; i++){

    result.push(
      list[i] || ""
    );

  }

  return result;
}


/*
Velg tilfeldig element som ikke allerede
er brukt i denne økten.
*/

function pick(list,used){

  var open = [];

  for(var i=0; i<MAX; i++){

    if(
      list[i] &&
      used.indexOf(i) === -1
    ){

      open.push(i);

    }

  }


  if(open.length === 0){
    return -1;
  }


  return open[
    Math.floor(
      Math.random() *
      open.length
    )
  ];

}


/*
=================================================
TEGN HJUL
=================================================
*/

function drawWheel(
  ctx,
  labels,
  used,
  empty,
  angle,
  isQuestion
){

  var size = 520;
  var radius = size / 2;

  var slice =
    2 * Math.PI / MAX;


  ctx.clearRect(
    0,
    0,
    size,
    size
  );


  ctx.save();

  ctx.translate(
    radius,
    radius
  );

  ctx.rotate(angle);


  for(var i=0; i<MAX; i++){

    var start =
      i * slice;

    var end =
      start + slice;


    ctx.beginPath();

    ctx.moveTo(
      0,
      0
    );

    ctx.arc(
      0,
      0,
      radius - 5,
      start,
      end
    );

    ctx.closePath();


    /*
    Tomme og brukte felt blir grå.
    */

    if(
      empty.indexOf(i) >= 0 ||
      used.indexOf(i) >= 0
    ){

      ctx.fillStyle =
        "#b8b8b8";

    }
    else{

      ctx.fillStyle =
        i % 2 === 0 ?
        "#d9ecff" :
        "#7db8e8";

    }


    ctx.fill();


    ctx.strokeStyle =
      "white";

    ctx.lineWidth =
      2;

    ctx.stroke();


    /*
    Tekst / nummer
    */

    ctx.save();

    ctx.rotate(
      start +
      slice / 2
    );

    ctx.textAlign =
      "right";

    ctx.fillStyle =
      "#111";

    ctx.font =
      "15px Arial";


    var wheelText = "";


    if(
      empty.indexOf(i) < 0
    ){

      if(isQuestion){

        wheelText =
          String(i+1);

      }
      else{

        wheelText =
          labels[i];

      }

    }


    ctx.fillText(
      wheelText,
      radius - 20,
      6
    );


    ctx.restore();

  }


  ctx.restore();


  /*
  Hvit sirkel i sentrum
  */

  ctx.beginPath();

  ctx.arc(
    radius,
    radius,
    24,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "white";

  ctx.fill();


  ctx.strokeStyle =
    "#333";

  ctx.lineWidth =
    2;

  ctx.stroke();

}


/*
Tegn begge hjul.
*/

function drawAll(){

  drawWheel(
    sctx,
    padded(names),
    usedStudents,
    emptyIndexes(names),
    studentAngle,
    false
  );


  drawWheel(
    qctx,
    padded(questions),
    usedQuestions,
    emptyIndexes(questions),
    questionAngle,
    true
  );

}


/*
=================================================
SPINN HJUL
=================================================
*/

function spin(type){

  if(spinning){
    return;
  }


  spinning = true;


  var list =
    type === "student" ?
    names :
    questions;


  var used =
    type === "student" ?
    usedStudents :
    usedQuestions;


  var chosen =
    pick(list,used);


  if(chosen < 0){

    alert(
      "Alt er brukt, eller bank mangler."
    );

    spinning = false;

    return;
  }


  var start =
    type === "student" ?
    studentAngle :
    questionAngle;


  var slice =
    2 * Math.PI / MAX;


  /*
  Pekeren står på toppen.
  */

  var target =
    (3 * Math.PI / 2) -
    (
      chosen * slice +
      slice / 2
    );


  /*
  7 hele rotasjoner.
  */

  var finalAngle =
    target +
    (7 * 2 * Math.PI);


  var duration =
    2500;


  var startTime =
    null;


  function animate(time){

    if(!startTime){
      startTime = time;
    }


    var progress =
      Math.min(
        (time-startTime) /
        duration,
        1
      );


    var ease =
      1 -
      Math.pow(
        1-progress,
        3
      );


    var currentAngle =
      start +
      ease *
      (
        finalAngle -
        start
      );


    if(type === "student"){

      drawWheel(
        sctx,
        padded(names),
        usedStudents,
        emptyIndexes(names),
        currentAngle,
        false
      );

    }
    else{

      drawWheel(
        qctx,
        padded(questions),
        usedQuestions,
        emptyIndexes(questions),
        currentAngle,
        true
      );

    }


    if(progress < 1){

      requestAnimationFrame(
        animate
      );

    }
    else{

      if(type === "student"){

        studentAngle =
          finalAngle %
          (2*Math.PI);


        usedStudents.push(
          chosen
        );


        el(
          "studentResult"
        ).textContent =
          "Valgt student: " +
          names[chosen];

      }
      else{

        questionAngle =
          finalAngle %
          (2*Math.PI);


        usedQuestions.push(
          chosen
        );


        selectedQuestion =
          chosen;


        el(
          "questionResult"
        ).textContent =
          "Valgt spørsmål: " +
          (chosen+1);


        el(
          "questionText"
        ).innerHTML =
          "<b>Spørsmål " +
          (chosen+1) +
          ":</b><br>" +
          questions[chosen];


        el(
          "questionText"
        ).className =
          "box";


        el(
          "answerText"
        ).className =
          "box answer hidden";

      }


      spinning = false;

      drawAll();

    }

  }


  requestAnimationFrame(
    animate
  );

}


/*
=================================================
VIS SVAR
=================================================
*/

function showAnswer(){

  if(selectedQuestion < 0){

    alert(
      "Velg spørsmål først."
    );

    return;
  }


  el(
    "answerText"
  ).innerHTML =
    "<b>Riktig svar:</b><br>" +
    answers[
      selectedQuestion
    ];


  el(
    "answerText"
  ).className =
    "box answer";

}

=================================================
RESETT ØKT
=================================================
*/

function resetSession(){

  usedStudents = [];
  usedQuestions = [];

  selectedQuestion =
    -1;


  studentAngle =
    0;

  questionAngle =
    0;


  el(
    "studentResult"

    "questionResult"

    "";


  el(
    "questionText"
  ).className =
    "box hidden";


  el(
    "answerText"
  ).className =
    "box answer hidden";


  drawAll();

}
